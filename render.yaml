services:
  - type: worker
    name: userbot1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGO_URI
        sync: false
      - key: LOG_GROUP_ID
        sync: false
      - key: BOT_NAME
        value: Userbot1
      - key: PREFIXES
        value: ".!"
      - key: AUTO_DELETE
        value: "true"
      - key: DELETE_DELAY
        value: "1"
